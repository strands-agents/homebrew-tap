name: Package request
description: Ask for a Strands command-line tool to be added to this tap
title: "[PACKAGE] "
labels: ["enhancement"]
body:
  - type: input
    id: repository
    attributes:
      label: Repository
      description: The tool's GitHub repository.
      placeholder: https://github.com/strands-agents/<tool>
    validations:
      required: true
  - type: textarea
    id: releases
    attributes:
      label: Release packages
      description: Which platforms the tool's GitHub releases publish packages for, and whether they come with a `SHA256SUMS.txt`.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Signing, files the tool needs next to its binary, or anything else that helps.
    validations:
      required: false
