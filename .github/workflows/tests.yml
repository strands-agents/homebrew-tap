name: Tests

on:
  pull_request:
  push:
    branches: [main]
  # Catch Homebrew changes that break a cask between releases.
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_ANALYTICS: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  syntax:
    name: Style and audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # setup-homebrew fetches this tap itself; the token lets it read a private repository.
      - uses: Homebrew/actions/setup-homebrew@61b401267256bb9c047d6d1481b176d5772a0ba7 # 2026.11.23.1
        with:
          token: ${{ github.token }}

      - name: Style
        run: brew style strands-agents/tap

      # Without --os=all, audit on Linux skips every cask that has depends_on macos.
      - name: Audit
        run: brew audit --strict --online --os=all --arch=all --tap=strands-agents/tap

      - name: Checksums
        run: .github/tests/checksums.sh strands-agents/tap/box

      - name: Livecheck
        run: brew livecheck --tap=strands-agents/tap

  box:
    name: box (${{ matrix.runner }})
    needs: syntax
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      BOX_TELEMETRY: "0"
      DO_NOT_TRACK: "1"
    steps:
      - uses: Homebrew/actions/setup-homebrew@61b401267256bb9c047d6d1481b176d5772a0ba7 # 2026.11.23.1
        with:
          token: ${{ github.token }}

      - name: Allow unprivileged user namespaces
        if: runner.os == 'Linux'
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Install
        run: brew install --cask strands-agents/tap/box

      - name: Test
        run: .github/tests/box.sh

      - name: Uninstall
        run: |
          brew uninstall --cask box
          test ! -e "$(brew --prefix)/bin/box"

  # The one check the main branch ruleset requires. It fails if any job above failed or was
  # skipped, so a new job only needs to be added to this list.
  gate:
    name: CI Gate
    if: always()
    needs: [syntax, box]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check the jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
