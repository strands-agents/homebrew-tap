name: Test casks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  box:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      DO_NOT_TRACK: "1"
      BOX_TELEMETRY: "0"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Homebrew/actions/setup-homebrew@61b401267256bb9c047d6d1481b176d5772a0ba7 # main

      - name: Style and audit
        run: |
          brew --version
          brew style --cask strands-agents/tap/box
          brew audit --cask --strict --online strands-agents/tap/box

      - name: Allow unprivileged user namespaces
        if: runner.os == 'Linux'
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Install
        run: brew install --cask strands-agents/tap/box

      - name: Check the installed files
        run: |
          set -euo pipefail
          version=$(brew info --cask --json=v2 strands-agents/tap/box | jq -r '.casks[0].version')
          room="$(brew --caskroom)/box/$version"
          ls -la "$(brew --prefix)/bin/box" "$room"
          test "$(box --version)" = "box $version"
          box help agent

      - name: Check the signature
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          version=$(brew info --cask --json=v2 strands-agents/tap/box | jq -r '.casks[0].version')
          room="$(brew --caskroom)/box/$version"
          xattr -l "$room/box" || true
          for program in box strands-box-sock-alias strands-box-contain-trampoline; do
            codesign --verify --strict --verbose=2 "$room/$program"
            codesign --display --verbose=4 "$room/$program" 2>&1 |
              grep -E '^(Identifier|Authority=Developer ID Application|TeamIdentifier|Timestamp)='
          done
          spctl --assess --type install --verbose "$room/box"

      - name: Run a box
        run: |
          set -euo pipefail
          box="$(brew --prefix)/bin/box"
          home="$RUNNER_TEMP/home"
          mkdir -p "$home/.strands/box/profiles" "$home/project"
          cp -R .github/box-probe "$home/.strands/box/profiles/probe"
          cd "$home/project"
          env -i HOME="$home" PATH=/usr/bin:/bin DO_NOT_TRACK=1 \
            "$box" profile create claude --with bedrock --policy open < /dev/null
          test -f "$home/.strands/box/profiles/claude/profile.toml"
          env -i HOME="$home" PATH=/usr/bin:/bin DO_NOT_TRACK=1 \
            "$box" run probe --no-banner -- -c 'echo brew > proof.txt' < /dev/null
          test "$(cat proof.txt)" = brew
          if env -i HOME="$home" PATH=/usr/bin:/bin DO_NOT_TRACK=1 \
            "$box" run probe --no-banner -- -c "echo escaped > '$home/outside.txt'" < /dev/null; then
            echo "::error::a write outside the project succeeded"
          fi
          test ! -e "$home/outside.txt"

      - name: Uninstall
        run: |
          brew uninstall --cask box
          test ! -e "$(brew --prefix)/bin/box"
